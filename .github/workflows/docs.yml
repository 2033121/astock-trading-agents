name: Docs (GitHub Pages)

permissions:
  contents: read
  pages: write
  id-token: write

on:
  push:
    branches: [master]
    paths:
      - "README.md"
      - "README.en.md"
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install mkdocs
        run: pip install mkdocs-material
      - name: Sync root readmes into docs
        run: |
          cp README.md docs/使用说明.md
          cp README.en.md docs/
          sed -i 's#](README.md)#](使用说明.md)#g' docs/README.en.md
          sed -i 's#](README.en.md)#](README.en.md)#g' docs/使用说明.md
          sed -i 's#](docs/images/#](images/#g' docs/使用说明.md
      - name: Build site
        run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

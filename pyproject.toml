[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "astock-trader"
version = "0.4.0"
description = "A-share multi-agent quantitative trading decision framework based on LangGraph debate architecture"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "AStock Trading Agents Contributors" },
]
keywords = [
    "quantitative-trading",
    "a-shares",
    "multi-agent",
    "langgraph",
    "stock-analysis",
    "investment-decision",
    "deepseek",
    "chinese-stock-market",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
    "langgraph>=0.4.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "pandas>=2.0.0",
    "akshare>=1.14.0",
    "requests>=2.31.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
    "pydantic>=2.0.0",
    "typing-extensions>=4.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "pre-commit>=3.7.0",
]
tushare = [
    "tushare>=1.4.0",
]

[project.urls]
Homepage = "https://github.com/2033121/astock-trading-agents"
Repository = "https://github.com/2033121/astock-trading-agents"
Issues = "https://github.com/2033121/astock-trading-agents/issues"
Changelog = "https://github.com/2033121/astock-trading-agents/blob/master/CHANGELOG.md"

[project.scripts]
astock-trader = "astock_trader.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/astock_trader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults (Typer pattern)
    "B007",  # unused loop variable
    "B023",  # function definition does not bind loop variable (false positive in closures)
    "B904",  # raise from in except clause (Typer exit pattern)
    "B905",  # zip() without strict= (Python 3.10 compat)
    "N812",  # lowercase import (LangGraph convention)
    "N802",  # function name should be lowercase (agent factory pattern)
    "SIM103", # return negated condition directly (readability preference)
    "SIM108", # use ternary operator (readability preference)
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["S101"]  # assert usage in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

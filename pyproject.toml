[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "astock-trader"
version = "0.1.0"
description = "A股多Agent量化交易决策框架 — 基于LangGraph的多角色辩论式分析"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.urls]
Homepage = "https://github.com/2033121/astock-trading-agents"
Repository = "https://github.com/2033121/astock-trading-agents"
Issues = "https://github.com/2033121/astock-trading-agents/issues"
dependencies = [
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
    "langgraph>=0.4.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "pandas>=2.0.0",
    "akshare>=1.14.0",
    "requests>=2.31.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
    "pydantic>=2.0.0",
    "typing-extensions>=4.8.0",
]

[project.scripts]
astock-trader = "astock_trader.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/astock_trader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
